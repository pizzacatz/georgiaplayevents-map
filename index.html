    <script>
        try { lucide.createIcons(); } catch (e) { console.warn("Lucide icons failed to load:", e); }
        function getLocalDateString() {
            const today = new Date();
            const yyyy = today.getFullYear();
            const mm = String(today.getMonth() + 1).padStart(2, '0');
            const dd = String(today.getDate()).padStart(2, '0');
            return yyyy + '-' + mm + '-' + dd;
        }
        function getLocalMonthString() { return getLocalDateString().slice(0, 7); }

        // Event start dates are local wall-clock; shift by the offset so
        // toISOString() doesn't roll evening events onto the next day.
        function toDateStr(d) {
            return new Date(d.getTime() - (d.getTimezoneOffset() * 60000)).toISOString().split('T')[0];
        }

        const MONTH_NAMES = ['January', 'February', 'March', 'April', 'May', 'June',
                             'July', 'August', 'September', 'October', 'November', 'December'];

        // Months are handled as plain "YYYY-MM" keys: they sort and compare as strings.
        function monthLabel(key) {
            const parts = key.split('-');
            return MONTH_NAMES[parseInt(parts[1], 10) - 1] + ' ' + parts[0];
        }
        function addMonths(key, delta) {
            const parts = key.split('-');
            let y = parseInt(parts[0], 10);
            let m = parseInt(parts[1], 10) - 1 + delta;
            y += Math.floor(m / 12);
            m = ((m % 12) + 12) % 12;
            return y + '-' + String(m + 1).padStart(2, '0');
        }
        function lastDayOfMonth(key) {
            const parts = key.split('-');
            return toDateStr(new Date(parseInt(parts[0], 10), parseInt(parts[1], 10), 0));
        }
        function escapeHtml(s) {
            return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
                .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

    document.getElementById('datePicker').value = getLocalDateString();

        // 1. Mobile Animation Logic
        var isPanelOpen = true;
        var collapsibleSection = document.getElementById('collapsibleSection');
        var mobileMenuToggle = document.getElementById('mobileMenuToggle');
        var mobileDateLabel = document.getElementById('mobileDateLabel');

        function toggleMobileMenu() {
            if (window.innerWidth >= 768) return; 

            isPanelOpen = !isPanelOpen;
            
            if (isPanelOpen) {
                collapsibleSection.classList.remove('max-h-0', 'opacity-0', 'scale-y-95');
                collapsibleSection.classList.add('max-h-[1000px]', 'opacity-100', 'scale-y-100');
                mobileMenuToggle.classList.add('bg-blue-800');
                mobileDateLabel.classList.add('hidden');
            } else {
                collapsibleSection.classList.remove('max-h-[1000px]', 'opacity-100', 'scale-y-100');
                collapsibleSection.classList.add('max-h-0', 'opacity-0', 'scale-y-95');
                mobileMenuToggle.classList.remove('bg-blue-800');
                mobileDateLabel.classList.remove('hidden');
            }
        }

        mobileMenuToggle.addEventListener('click', toggleMobileMenu);

        window.addEventListener('DOMContentLoaded', function() {
            if (window.innerWidth < 768) {
                setTimeout(function() {
                    if (isPanelOpen) toggleMobileMenu();
                }, 1800);
            }
        });

        // 2. Map Initialization
        //
        // CARTO vector basemap. The key below is a public, client-side basemap
        // token: this is a static site, so anything here ships in the page
        // source by design. It is protected by the domain allowlist configured
        // in the CARTO account, not by secrecy.
        const CARTO_KEY = 'cb1_25gw_1_f567bbe33f3553fef553eab3';
        const BASEMAP_STYLE = 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json?key=' + CARTO_KEY;

        // CARTO's TileJSON hands back tile URLs without the key on them, so the
        // key on the style URL alone would only ever tag that one request.
        // Stamping it onto every CARTO request keeps usage attributed to our
        // account and keeps the map working if CARTO starts enforcing keys on
        // vector tiles the way it already does on raster.
        function withCartoKey(url) {
            if (url.indexOf('cartocdn.com') === -1) return { url: url };
            if (url.indexOf('key=') !== -1) return { url: url };
            return { url: url + (url.indexOf('?') === -1 ? '?' : '&') + 'key=' + CARTO_KEY };
        }

        // MapLibre serves 512px vector tiles, so its zoom sits one level "out"
        // from Leaflet's at the same scale: the old Leaflet 8 is 7 here.
        const map = new maplibregl.Map({
            container: 'map',
            style: BASEMAP_STYLE,
            center: [-84.5499, 33.9526],
            zoom: 7,
            maxZoom: 19,
            attributionControl: { compact: true },
            transformRequest: withCartoKey
        });
        map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'top-right');

        const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

        // Pins are inline SVG rather than remote PNGs, so the map has no
        // dependency on a third-party image host to draw its own markers.
        const PIN_COLORS = {
            blue: '#2A81CB',
            red: '#CB2B3E',
            green: '#2AAD27',
            gold: '#FFD326',
            violet: '#9C2BCB'  // several games at one venue
        };

        function pinDataUri(fill) {
            const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="50" height="82" viewBox="0 0 25 41">' +
                '<path d="M12.5 0.5C6 0.5 0.5 5.8 0.5 12.4c0 9 12 28.1 12 28.1s12-19.1 12-28.1C24.5 5.8 19 0.5 12.5 0.5z" ' +
                'fill="' + fill + '" stroke="#111827" stroke-width="1"/>' +
                '<circle cx="12.5" cy="12.4" r="4.6" fill="#f8fafc"/></svg>';
            return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
        }

        function loadPin(name, fill) {
            return new Promise(function (resolve) {
                const img = new Image(50, 82);
                img.onload = function () {
                    if (!map.hasImage(name)) map.addImage(name, img);
                    resolve();
                };
                img.onerror = function () { resolve(); };
                img.src = pinDataUri(fill);
            });
        }

        // MapLibre clusters natively off a GeoJSON source, which replaces the
        // Leaflet.markercluster layer. Features are rebuilt on every render.
        const EVENTS_SOURCE = 'events';
        let eventFeatures = [];

        function syncEventFeatures() {
            const src = map.getSource(EVENTS_SOURCE);
            if (src) src.setData({ type: 'FeatureCollection', features: eventFeatures });
        }

        // Everything that touches sources/layers has to wait for style load.
        const mapReady = new Promise(function (resolve) {
            map.on('load', async function () {
                await Promise.all([
                    loadPin('pin-blue', PIN_COLORS.blue),
                    loadPin('pin-red', PIN_COLORS.red),
                    loadPin('pin-green', PIN_COLORS.green),
                    loadPin('pin-violet', PIN_COLORS.violet)
                ]);

                map.addSource(EVENTS_SOURCE, {
                    type: 'geojson',
                    data: { type: 'FeatureCollection', features: [] },
                    cluster: true,
                    clusterMaxZoom: 13,
                    clusterRadius: 45
                });

                map.addLayer({
                    id: 'clusters',
                    type: 'circle',
                    source: EVENTS_SOURCE,
                    filter: ['has', 'point_count'],
                    paint: {
                        'circle-color': '#2563eb',
                        'circle-opacity': 0.9,
                        'circle-stroke-width': 4,
                        'circle-stroke-color': 'rgba(37, 99, 235, 0.3)',
                        'circle-radius': ['step', ['get', 'point_count'], 15, 5, 20, 15, 26]
                    }
                });

                map.addLayer({
                    id: 'cluster-count',
                    type: 'symbol',
                    source: EVENTS_SOURCE,
                    filter: ['has', 'point_count'],
                    layout: {
                        'text-field': ['get', 'point_count_abbreviated'],
                        'text-font': ['Open Sans Bold'],
                        'text-size': 13
                    },
                    paint: { 'text-color': '#ffffff' }
                });

                map.addLayer({
                    id: 'event-points',
                    type: 'symbol',
                    source: EVENTS_SOURCE,
                    filter: ['!', ['has', 'point_count']],
                    layout: {
                        'icon-image': ['get', 'icon'],
                        'icon-size': 0.5,
                        'icon-anchor': 'bottom',
                        'icon-allow-overlap': true
                    }
                });

                map.on('click', 'event-points', function (e) {
                    const f = e.features[0];
                    new maplibregl.Popup({ offset: [0, -38], maxWidth: '300px' })
                        .setLngLat(f.geometry.coordinates.slice())
                        .setHTML(f.properties.html)
                        .addTo(map);
                });

                map.on('click', 'clusters', async function (e) {
                    const f = e.features[0];
                    const zoom = await map.getSource(EVENTS_SOURCE)
                        .getClusterExpansionZoom(f.properties.cluster_id);
                    map.easeTo({ center: f.geometry.coordinates, zoom: zoom });
                });

                ['event-points', 'clusters'].forEach(function (id) {
                    map.on('mouseenter', id, function () { map.getCanvas().style.cursor = 'pointer'; });
                    map.on('mouseleave', id, function () { map.getCanvas().style.cursor = ''; });
                });

                resolve();
            });
        });

        // 3. Geocoding Cache & Overrides
        const manualOverrides = {

            // Nominatim returns nothing for any of these: the suite/unit token

            "5920 ROSWELL RD A120, SANDY SPRINGS, GA 30328": [33.9167, -84.3815],

            "5780 C.H. JAMES PARKWAY #230, POWDER SPRINGS, GA 30127": [33.8775, -84.7111],
            "609 N CHURCH ST B, THOMASTON, GA 30286": [32.8966, -84.3280],
            "10820 ABBOTTS BRIDGE RD #240, DULUTH, GA 30097": [34.0258, -84.1660],
            "1210 E JACKSON ST STE E, THOMASVILLE, GA 31792": [30.8491, -83.9633],
            "2752 E PONCE DE LEON AVE B, DECATUR, GA 30030": [33.7758, -84.2871],
            "965 DULUTH HWY STE 102, LAWRENCEVILLE, GA 30043": [33.9674, -84.0171],
            "144 MALL BLVD C04B, BRUNSWICK, GA 31525": [31.2171, -81.4900],

            // Same venue as the "3334 STONE MOUNTAIN HWY" entries above (US-78
            // *is* Stone Mountain Hwy) and same as "3650 SATELLITE BLVD" —
            // reusing their coordinates so one store stays one pin rather than
            // splitting into two under the venue grouping.
            "3334 US-78 B, SNELLVILLE, GA 30078": [33.8290, -84.0200],
            "3650 SATELLITE BLVD B, DULUTH, GA 30096": [33.9550, -84.1470],

            // Point Bluff Pkwy does not exist in OpenStreetMap yet, so this is
            // the Harlem town centre, not the venue. The popup still links to
            // the real address on Google Maps; tighten if you know the spot.
            "710 POINT BLUFF PARKWAY STE 1, HARLEM, GA 30814": [33.4146, -82.3126]
        };

        function normalizeAddress(addr) {
            let cleanAddr = addr.toUpperCase().split(', ,')[0];
            return cleanAddr.replace(/,\s*USA?$/, '').trim();
        }

        // Nominatim fails outright on a street line carrying a suite or unit
        // ("5920 ROSWELL RD A120" finds nothing, "5920 ROSWELL RD" is fine),
        // which silently dropped a quarter of the feed's events off the map.
        // Returns null when there is no suite to strip, so the caller only
        // spends a second retrying when it might actually help.
        function withoutSuite(cleanAddr) {
            const parts = cleanAddr.split(',');
            const street = parts[0]
                .replace(/\s+(STE|SUITE|UNIT|APT|BLDG|RM)\.?\s*[\w-]+$/, '')
                .replace(/\s+#\s*[\w-]+$/, '')
                // Requires a leading letter (A120, C04B) so a route number
                // is never mistaken for a unit: "265 HWY 53" must stay whole.
                .replace(/\s+[A-Z]{1,2}\d{1,4}[A-Z]?$/, '')
                .replace(/\s+[A-Z]$/, '')
                .trim();
            if (!street || street === parts[0].trim()) return null;
            return [street].concat(parts.slice(1)).join(',').trim();
        }

        // Same lookup as getCoordinates minus the network call, so a render can
        // tell up front how many venues still need a (rate-limited) Nominatim hit.
        function cachedCoordinates(addr) {
            if (!addr) return null;
            const cleanAddr = normalizeAddress(addr);
            if (manualOverrides[cleanAddr]) return manualOverrides[cleanAddr];
            const cache = JSON.parse(localStorage.getItem('pokemonGeoCache')) || {};
            return cache[cleanAddr] || null;
        }

        async function getCoordinates(addr) {
            if (!addr) return null;

            const cleanAddr = normalizeAddress(addr);

            const known = cachedCoordinates(addr);
            if (known) return known;

            let cache = JSON.parse(localStorage.getItem('pokemonGeoCache')) || {};
            
            console.log("Asking internet for clean address: " + cleanAddr);

            // Try the address as written, then again without any suite/unit.
            const attempts = [cleanAddr];
            const bare = withoutSuite(cleanAddr);
            if (bare) attempts.push(bare);

            for (let i = 0; i < attempts.length; i++) {
                try {
                    const response = await fetch('https://nominatim.openstreetmap.org/search?format=json&q=' + encodeURIComponent(attempts[i]) + '&limit=1');
                    const data = await response.json();
                    await sleep(1100);

                    if (data && data.length > 0) {
                        const coords = [parseFloat(data[0].lat), parseFloat(data[0].lon)];
                        // Cache under the address we were asked for, so the
                        // retry only ever happens once per venue.
                        cache[cleanAddr] = coords;
                        localStorage.setItem('pokemonGeoCache', JSON.stringify(cache));
                        if (i > 0) console.log("Matched without suite: " + attempts[i]);
                        return coords;
                    }
                } catch (e) {
                    console.error("Geocoding error: ", e);
                    return null;
                }
            }

            console.warn("Nominatim couldn't find: " + cleanAddr);
            console.warn("Original string to add to Manual Override: " + addr);
            return null;
        }

        // 4. Data Pipeline
        let globalEventsList = [];

        // A status banner so the user is never left staring at a silent blank map.
        function showStatus(message, opts) {
            opts = opts || {};
            const alertBox = document.getElementById('noEventsAlert');
            const alertPrefix = document.getElementById('alertPrefix');
            const nextLink = document.getElementById('nextEventLink');
            document.getElementById('alertTitle').classList.add('hidden');
            alertPrefix.textContent = message;
            if (opts.retry) {
                nextLink.style.display = "inline";
                nextLink.textContent = "Retry";
                nextLink.removeAttribute('data-date');
            } else {
                nextLink.style.display = "none";
            }
            alertBox.classList.remove('hidden');
        }
        function hideStatus() {
            document.getElementById('noEventsAlert').classList.add('hidden');
        }

        // The site's primary source is a copy of the feed committed to the repo
        // by a scheduled GitHub Action (see .github/workflows/update-events.yml).
        // Served same-origin, it needs no CORS proxy at all.
        const LOCAL_FEED_URL = './events.ics';

        // Live CORS proxies, used only as a fallback if the committed feed is
        // missing/stale. Public proxies rot often; allorigins /get is used
        // because it reliably sends CORS headers and reports the upstream status.
        const CORS_PROXIES = [
            { url: target => 'https://api.allorigins.win/get?url=' + encodeURIComponent(target), json: true },
            { url: target => 'https://api.codetabs.com/v1/proxy/?quest=' + encodeURIComponent(target), json: false }
        ];

        // Try the same-origin committed feed first.
        async function fetchLocalFeed() {
            try {
                const response = await fetch(LOCAL_FEED_URL, { cache: 'no-cache' });
                if (!response.ok) {
                    console.warn("Local feed returned HTTP " + response.status);
                    return null;
                }
                const text = await response.text();
                if (text && text.indexOf('BEGIN:VCALENDAR') !== -1) {
                    console.log("Loaded feed from same-origin events.ics");
                    return text;
                }
                console.warn("Local feed was not a valid calendar.");
            } catch (e) {
                console.warn("Local feed fetch failed:", e);
            }
            return null;
        }

        // Fetch the feed through whichever proxy responds with a real calendar.
        async function fetchViaProxies(target) {
            for (let i = 0; i < CORS_PROXIES.length; i++) {
                const proxy = CORS_PROXIES[i];
                const url = proxy.url(target);
                try {
                    console.log("Trying proxy " + (i + 1) + "/" + CORS_PROXIES.length + ": " + url);
                    const response = await fetch(url);
                    if (!response.ok) {
                        console.warn("Proxy returned HTTP " + response.status);
                        continue;
                    }
                    let text;
                    if (proxy.json) {
                        const data = await response.json();
                        if (data && data.status) console.log("Upstream (pokedata.ovh) status: " + data.status.http_code);
                        text = (data && data.contents) ? data.contents : "";
                    } else {
                        text = await response.text();
                    }
                    if (text && text.indexOf('BEGIN:VCALENDAR') !== -1) {
                        return text; // Looks like a real ICS feed.
                    }
                    console.warn("Proxy response was not a valid calendar (got " + (text ? text.length : 0) + " chars).");
                } catch (e) {
                    console.warn("Proxy attempt failed:", e);
                }
            }
            return null;
        }

        async function fetchPokemonEvents() {
            showStatus("Loading events…");
            try {
                // Generate a rolling date string to fetch recent/future events
                const fetchDate = new Date();
                fetchDate.setDate(fetchDate.getDate() - 2); // Buffer 2 days
                const yyyy = fetchDate.getFullYear();
                const mm = String(fetchDate.getMonth() + 1).padStart(2, '0');
                const dd = String(fetchDate.getDate()).padStart(2, '0');
                const dynamicDateStr = yyyy + '-' + mm + '-' + dd;

                // Inject the dynamic date into the Pokedata URL
                const BASE_URL = 'https://pokedata.ovh/events/api/_tcg/cups/challenges/pre/_go/cups/challenges/_vg/cups/challenges/_country/US/_state/GA/Georgia/_start/' + dynamicDateStr + '/ics';

                console.log("Fetching: " + BASE_URL);
                // Prefer the same-origin committed feed; fall back to live proxies.
                let rawText = await fetchLocalFeed();
                if (!rawText) rawText = await fetchViaProxies(BASE_URL);

                if (!rawText) {
                    showStatus("Couldn't load events. Check your connection and ", { retry: true });
                    return;
                }

                const jcal = ICAL.parse(rawText);
                const comp = new ICAL.Component(jcal);
                globalEventsList = comp.getAllSubcomponents('vevent');

                console.log("Loaded " + globalEventsList.length + " events.");
                hideStatus();
                buildMonthOptions();
                renderEvents();
            } catch (e) {
                console.error("Pipeline Failed:", e);
                showStatus("Couldn't load events. ", { retry: true });
            }
        }

        // 5. The "Split Brain" Filter Logic
        //
        // Everything a rendered pin or a filter needs is derived once per event
        // and memoised — the month view walks the whole feed several times
        // (pin grouping, month counts, "next event" lookup) and re-parsing each
        // VEVENT every pass is wasted work.
        const eventInfoCache = new WeakMap();

        function getEventInfo(vevent) {
            const cached = eventInfoCache.get(vevent);
            if (cached) return cached;

            const event = new ICAL.Event(vevent);
            const desc = event.description || "";

            let eventUrl = vevent.getFirstPropertyValue('url') || "";
            const hrefMatch = desc.match(/href="([^"]+)"/i);
            if (hrefMatch) eventUrl = hrefMatch[1];
            eventUrl = eventUrl ? eventUrl.toString() : "";

            // GAME TYPE DETECTION: Use RAW summary
            const rawSummaryUp = (event.summary || "").toUpperCase();
            const urlUp = eventUrl.toUpperCase();

            let isTcg = urlUp.indexOf('_TCG') !== -1 || rawSummaryUp.indexOf('TCG') !== -1 || rawSummaryUp.indexOf('TRADING CARD') !== -1;
            const isVgc = urlUp.indexOf('_VG') !== -1 || rawSummaryUp.indexOf('VGC') !== -1 || rawSummaryUp.indexOf('VG ') !== -1 || rawSummaryUp.indexOf('VIDEO GAME') !== -1;
            const isGo = urlUp.indexOf('_GO') !== -1 || rawSummaryUp.indexOf(' GO ') !== -1 || rawSummaryUp.indexOf('GO ') === 0 || rawSummaryUp.indexOf('POKEMON GO') !== -1;

            if (!isTcg && !isVgc && !isGo) isTcg = true;

            // TIER DETECTION: Use CLEAN inner text
            const anchorMatch = desc.match(/<a[^>]*>(.*?)<\/a>/i);
            const innerText = anchorMatch ? anchorMatch[1].replace(/<[^>]*>/g, '').trim() : "";
            const cleanTitleUp = (innerText || event.summary || "").toUpperCase();

            const start = event.startDate.toJSDate();

            // Marker colour follows the game, matching the filter headings.
            let game = 'tcg';
            if (isVgc) game = 'vgc';
            else if (isGo) game = 'go';

            const info = {
                // Show the calendar event's name exactly as written; the
                // description anchor text is only a fallback for events
                // that somehow lack a SUMMARY.
                title: event.summary || innerText || "Event",
                location: event.location || "",
                url: eventUrl,
                start: start,
                dateStr: toDateStr(start),
                month: toDateStr(start).slice(0, 7),
                game: game,
                isTcg: isTcg,
                isVgc: isVgc,
                isGo: isGo,
                isCup: cleanTitleUp.indexOf('CUP') !== -1 || cleanTitleUp.indexOf('SHOWDOWN') !== -1,
                isChallenge: cleanTitleUp.indexOf('CHALLENGE') !== -1,
                isPrerelease: cleanTitleUp.indexOf('PRERELEASE') !== -1 || cleanTitleUp.indexOf('PRE-RELEASE') !== -1 || cleanTitleUp.indexOf('PRE RELEASE') !== -1
            };

            eventInfoCache.set(vevent, info);
            return info;
        }

        const GAME_ICONS = { tcg: 'pin-blue', vgc: 'pin-red', go: 'pin-green' };
        const GAME_DOTS = { tcg: '#2563eb', vgc: '#dc2626', go: '#16a34a' };

        function doesEventPassFilters(vevent) {
            const showTcgChallenge = document.getElementById('filterTcgChallenge').checked;
            const showTcgCup = document.getElementById('filterTcgCup').checked;
            const showTcgPrerelease = document.getElementById('filterTcgPrerelease').checked;
            
            const showVgcChallenge = document.getElementById('filterVgcChallenge').checked;
            const showVgcCup = document.getElementById('filterVgcCup').checked;
            
            const showGoChallenge = document.getElementById('filterGoChallenge').checked;
            const showGoCup = document.getElementById('filterGoCup').checked;

            const info = getEventInfo(vevent);
            const isCup = info.isCup, isChallenge = info.isChallenge, isPrerelease = info.isPrerelease;

            // FILTER MATRIX
            if (info.isTcg) {
                if (isCup && showTcgCup) return true;
                if (isChallenge && showTcgChallenge) return true;
                if (isPrerelease && showTcgPrerelease) return true;
                if (!isCup && !isChallenge && !isPrerelease && (showTcgCup || showTcgChallenge || showTcgPrerelease)) return true; 
            } else if (info.isVgc) {
                if (isCup && showVgcCup) return true;
                if (isChallenge && showVgcChallenge) return true;
                if (!isCup && !isChallenge && (showVgcCup || showVgcChallenge)) return true;
            } else if (info.isGo) {
                if (isCup && showGoCup) return true;
                if (isChallenge && showGoChallenge) return true;
                if (!isCup && !isChallenge && (showGoCup || showGoChallenge)) return true;
            }

            return false;
        }

        function visibleEvents() {
            const out = [];
            for (let i = 0; i < globalEventsList.length; i++) {
                if (doesEventPassFilters(globalEventsList[i])) out.push(getEventInfo(globalEventsList[i]));
            }
            return out;
        }

        function findNextDate(currentStr) {
            const dates = visibleEvents()
                .map(info => info.dateStr)
                .filter(s => s > currentStr);
            if (dates.length > 0) return dates.sort()[0];
            return null;
        }

        // 6. Rendering
        //
        // Day view pins one date; month view pins a whole "YYYY-MM". Both share
        // the same path, so events sharing a venue always collapse into a single
        // pin with a list popup instead of stacking invisibly on top of each other.
        let viewMode = localStorage.getItem('pref_viewMode') === 'month' ? 'month' : 'day';
        let selectedMonth = getLocalMonthString();
        let renderToken = 0;

        function popupForVenue(events) {
            const cleanLocation = events[0].location.replace(/,\s*USA?.*$/i, '').trim();
            const mapsQuery = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(cleanLocation);
            const locationLink = '<a href="' + mapsQuery + '" target="_blank" rel="noopener noreferrer" style="color: #2563eb; text-decoration: underline; font-weight: 500;">' + escapeHtml(cleanLocation) + '</a>';

            if (events.length === 1) {
                const info = events[0];
                const timeStr = info.start.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                let html = '<div style="min-width: 200px; font-family: sans-serif;">' +
                    '<div style="font-weight: bold; font-size: 14px; margin-bottom: 8px; color: #111827;">' + escapeHtml(info.title) + '</div>' +
                    '<div style="font-size: 12px; color: #374151; margin-bottom: 4px;">📅 ' + info.start.toLocaleDateString() + ' at ' + timeStr + '</div>' +
                    '<div style="font-size: 12px; color: #374151; margin-bottom: 10px;">📍 ' + locationLink + '</div>';
                if (info.url) {
                    html += '<a href="' + escapeHtml(info.url) + '" target="_blank" style="display: block; text-align: center; background: #2563eb; color: white; text-decoration: none; padding: 6px; border-radius: 4px; font-size: 12px; font-weight: bold;">View Official Page</a>';
                }
                return html + '</div>';
            }

            let html = '<div style="min-width: 220px; max-width: 280px; font-family: sans-serif;">' +
                '<div style="font-weight: bold; font-size: 14px; color: #111827;">' + events.length + ' events here</div>' +
                '<div style="font-size: 12px; color: #374151; margin: 4px 0 6px;">📍 ' + locationLink + '</div>' +
                '<div style="max-height: 230px; overflow-y: auto;">';

            for (let i = 0; i < events.length; i++) {
                const info = events[i];
                const timeStr = info.start.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                html += '<div style="border-top: 1px solid #e5e7eb; padding: 7px 0;">' +
                    '<div style="font-weight: 600; font-size: 12px; color: #111827;">' +
                    '<span style="display: inline-block; width: 8px; height: 8px; border-radius: 9999px; background: ' + GAME_DOTS[info.game] + '; margin-right: 6px;"></span>' +
                    escapeHtml(info.title) + '</div>' +
                    '<div style="font-size: 11px; color: #374151; margin-top: 3px;">📅 ' + info.start.toLocaleDateString() + ' at ' + timeStr + '</div>';
                if (info.url) {
                    html += '<a href="' + escapeHtml(info.url) + '" target="_blank" rel="noopener noreferrer" style="font-size: 11px; color: #2563eb; text-decoration: underline; font-weight: 600;">View Official Page</a>';
                }
                html += '</div>';
            }

            return html + '</div></div>';
        }

        function iconForVenue(events) {
            const games = {};
            events.forEach(info => { games[info.game] = true; });
            const keys = Object.keys(games);
            return keys.length === 1 ? GAME_ICONS[keys[0]] : 'pin-violet';
        }

        async function renderEvents() {
            const token = ++renderToken;
            await mapReady;
            if (token !== renderToken) return;

            const isMonth = viewMode === 'month';
            const selDate = document.getElementById('datePicker').value;
            const selMonth = selectedMonth;

            const matches = visibleEvents()
                .filter(info => isMonth ? info.month === selMonth : info.dateStr === selDate)
                .sort((a, b) => a.start - b.start);

            // Geocoding is rate-limited, so warn instead of leaving the map frozen
            // on a stale month while lookups trickle in.
            const pendingLookups = [];
            matches.forEach(info => {
                if (info.location && !cachedCoordinates(info.location) && pendingLookups.indexOf(normalizeAddress(info.location)) === -1) {
                    pendingLookups.push(normalizeAddress(info.location));
                }
            });
            if (pendingLookups.length > 1) {
                showStatus("Locating " + pendingLookups.length + " venues…");
            }

            // Resolve every location before touching the map: a render started
            // while this one is awaiting Nominatim must not paint half of each.
            const venues = new Map();
            for (let i = 0; i < matches.length; i++) {
                const coords = await getCoordinates(matches[i].location);
                if (token !== renderToken) return; // superseded by a newer render
                if (!coords) continue;
                const key = coords[0].toFixed(5) + ',' + coords[1].toFixed(5);
                if (!venues.has(key)) venues.set(key, { coords: coords, events: [] });
                venues.get(key).events.push(matches[i]);
            }

            eventFeatures = [];
            let count = 0;
            venues.forEach(venue => {
                eventFeatures.push({
                    type: 'Feature',
                    geometry: { type: 'Point', coordinates: [venue.coords[1], venue.coords[0]] },
                    properties: {
                        icon: iconForVenue(venue.events),
                        html: popupForVenue(venue.events)
                    }
                });
                count += venue.events.length;
            });
            syncEventFeatures();

            const alertBox = document.getElementById('noEventsAlert');
            const alertTitle = document.getElementById('alertTitle');
            const alertPrefix = document.getElementById('alertPrefix');
            const nextLink = document.getElementById('nextEventLink');

            if (count === 0) {
                alertTitle.classList.remove('hidden');
                alertTitle.textContent = isMonth ? ('No events in ' + monthLabel(selMonth) + '.') : 'No events today.';
                const next = findNextDate(isMonth ? lastDayOfMonth(selMonth) : selDate);
                if (next) {
                    alertPrefix.textContent = "Next event is on ";
                    nextLink.style.display = "inline";
                    nextLink.textContent = isMonth ? monthLabel(next.slice(0, 7)) : next;
                    nextLink.setAttribute('data-date', next);
                } else {
                    alertPrefix.textContent = "There are no planned events at this time.";
                    nextLink.style.display = "none";
                }
                alertBox.classList.remove('hidden');
            } else { 
                alertBox.classList.add('hidden'); 
            }
        }

        // 7. Day / Month view switching
        //
        // The month dropdown spans every month the feed covers (plus the current
        // one), labelled with how many events survive the active filters, so the
        // switcher doubles as a "where are the events" overview.
        let monthOptionKeys = [];

        function buildMonthOptions() {
            const select = document.getElementById('monthPicker');

            const counts = {};
            visibleEvents().forEach(info => { counts[info.month] = (counts[info.month] || 0) + 1; });

            const withEvents = Object.keys(counts).sort();
            const current = getLocalMonthString();
            let first = withEvents.length ? withEvents[0] : current;
            let last = withEvents.length ? withEvents[withEvents.length - 1] : current;
            // Always keep today's month and whatever is selected reachable.
            [current, selectedMonth].forEach(key => {
                if (key < first) first = key;
                if (key > last) last = key;
            });

            monthOptionKeys = [];
            for (let key = first; key <= last && monthOptionKeys.length < 240; key = addMonths(key, 1)) {
                monthOptionKeys.push(key);
            }

            select.innerHTML = '';
            monthOptionKeys.forEach(key => {
                const option = document.createElement('option');
                option.value = key;
                option.textContent = monthLabel(key) + (counts[key] ? ' (' + counts[key] + ')' : '');
                select.appendChild(option);
            });
            select.value = selectedMonth;

            const index = monthOptionKeys.indexOf(selectedMonth);
            document.getElementById('prevMonthBtn').disabled = index <= 0;
            document.getElementById('nextMonthBtn').disabled = index === -1 || index >= monthOptionKeys.length - 1;
        }

        function setSelectedMonth(key) {
            selectedMonth = key;
            buildMonthOptions();
            renderEvents();
        }

        function stepMonth(delta) {
            const index = monthOptionKeys.indexOf(selectedMonth);
            const next = index === -1 ? addMonths(selectedMonth, delta) : monthOptionKeys[index + delta];
            if (next) setSelectedMonth(next);
        }

        function setSegmentState(btn, active) {
            btn.setAttribute('aria-pressed', active ? 'true' : 'false');
            btn.classList.toggle('bg-blue-600', active);
            btn.classList.toggle('text-white', active);
            btn.classList.toggle('shadow', active);
            btn.classList.toggle('text-gray-400', !active);
            btn.classList.toggle('hover:text-white', !active);
        }

        function updateViewModeUI() {
            const isMonth = viewMode === 'month';
            document.getElementById('dayControls').classList.toggle('hidden', isMonth);
            document.getElementById('monthControls').classList.toggle('hidden', !isMonth);
            setSegmentState(document.getElementById('viewDayBtn'), !isMonth);
            setSegmentState(document.getElementById('viewMonthBtn'), isMonth);

            document.getElementById('rangeLabelMobile').textContent = isMonth ? 'Select Month' : 'Select Date';
            document.getElementById('rangeLabelDesktop').textContent = isMonth ? 'Select Month' : 'Select Date';
            document.getElementById('todayBtnMobile').textContent = isMonth ? 'This Month' : 'Today';
            document.getElementById('todayBtnDesktop').textContent = isMonth ? 'This Month' : 'Today';
        }

        function setViewMode(mode) {
            viewMode = mode === 'month' ? 'month' : 'day';
            localStorage.setItem('pref_viewMode', viewMode);

            const datePicker = document.getElementById('datePicker');
            if (viewMode === 'month') {
                // Carry the day picker's month across so switching never jumps.
                selectedMonth = (datePicker.value || getLocalDateString()).slice(0, 7);
                buildMonthOptions();
            } else if (datePicker.value.slice(0, 7) !== selectedMonth) {
                const today = getLocalDateString();
                datePicker.value = today.slice(0, 7) === selectedMonth ? today : selectedMonth + '-01';
            }

            updateViewModeUI();
            renderEvents();
        }

        document.getElementById('viewDayBtn').addEventListener('click', () => setViewMode('day'));
        document.getElementById('viewMonthBtn').addEventListener('click', () => setViewMode('month'));
        document.getElementById('monthPicker').addEventListener('change', function() { setSelectedMonth(this.value); });
        document.getElementById('prevMonthBtn').addEventListener('click', () => stepMonth(-1));
        document.getElementById('nextMonthBtn').addEventListener('click', () => stepMonth(1));

        // 8. Event Listeners
        function setDateToToday() {
            if (viewMode === 'month') {
                selectedMonth = getLocalMonthString();
                buildMonthOptions();
            } else {
                document.getElementById('datePicker').value = getLocalDateString();
            }
            document.getElementById('noEventsAlert').classList.add('hidden');
            renderEvents();
        }
        document.getElementById('todayBtnMobile').addEventListener('click', setDateToToday);
        if (document.getElementById('todayBtnDesktop')) {
            document.getElementById('todayBtnDesktop').addEventListener('click', setDateToToday);
        }

        document.getElementById('datePicker').addEventListener('change', renderEvents);
        document.getElementById('prevDayBtn').addEventListener('click', () => { document.getElementById('datePicker').stepDown(); renderEvents(); });
        document.getElementById('nextDayBtn').addEventListener('click', () => { document.getElementById('datePicker').stepUp(); renderEvents(); });
        document.getElementById('closeAlertBtn').addEventListener('click', () => document.getElementById('noEventsAlert').classList.add('hidden'));

        document.getElementById('nextEventLink').addEventListener('click', function(e) {
            e.preventDefault();
            const d = this.getAttribute('data-date');
            if (d) {
                if (viewMode === 'month') {
                    setSelectedMonth(d.slice(0, 7));
                } else {
                    document.getElementById('datePicker').value = d;
                    renderEvents();
                }
            } else {
                // No date attached means this is the "Retry" action after a load failure.
                fetchPokemonEvents();
            }
        });

        updateViewModeUI();
        buildMonthOptions();

        // 9. Home Base Feature
        var hMarker = null;

        function setH(c, a) {
            localStorage.setItem('pokemonHomeCoords', JSON.stringify(c));
            if (a) { localStorage.setItem('pokemonHomeAddress', a); document.getElementById('homeInput').value = a; }
            const lngLat = [c[1], c[0]];
            map.flyTo({ center: lngLat, zoom: 9, duration: 1500 });
            if (hMarker) { hMarker.setLngLat(lngLat); return; }

            const el = document.createElement('img');
            el.src = pinDataUri(PIN_COLORS.gold);
            el.width = 25;
            el.height = 41;
            el.style.cursor = 'pointer';
            hMarker = new maplibregl.Marker({ element: el, anchor: 'bottom' })
                .setLngLat(lngLat)
                .setPopup(new maplibregl.Popup({ offset: [0, -38] }).setText('Home Base'))
                .addTo(map);
        }

        document.getElementById('goHomeBtn').addEventListener('click', async function() {
            var a = document.getElementById('homeInput').value.trim();
            if (!a) return;
            var s = a + (a.toLowerCase().indexOf('georgia') === -1 ? ', Georgia' : '');
            var c = await getCoordinates(s);
            if (c) setH(c, a);
        });

        document.getElementById('homeInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') document.getElementById('goHomeBtn').click(); });

        var sC = localStorage.getItem('pokemonHomeCoords');
        var sA = localStorage.getItem('pokemonHomeAddress');
        if (sC) mapReady.then(() => setH(JSON.parse(sC), sA));

        // 10. Filters Memory
        const ids = [
            'filterTcgChallenge', 'filterTcgCup', 'filterTcgPrerelease',
            'filterVgcChallenge', 'filterVgcCup',
            'filterGoChallenge', 'filterGoCup'
        ];
        
        ids.forEach(id => {
            const el = document.getElementById(id);
            if (localStorage.getItem('pref_' + id) === 'false') el.checked = false;
            el.addEventListener('change', () => {
                localStorage.setItem('pref_' + id, el.checked);
                buildMonthOptions(); // per-month counts follow the active filters
                renderEvents();
            });
        });

        // Start!
        fetchPokemonEvents();
    </script>
</body>
</html>
